<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="LoanPilot agentic underwriting flow from application to decision memo">
  <rect width="720" height="405" fill="#f7f6f3"/>

  <text x="360" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6b6b6b">LoanPilot: agent with tools, rules engine, and a human in the loop</text>

  <!-- Applicant -->
  <rect x="30" y="70" width="120" height="70" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Applicant</text>
  <text x="90" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">form + PDF docs</text>

  <line x1="155" y1="105" x2="195" y2="105" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="195,105 185,99 185,111" fill="#1a1a1a"/>

  <!-- API -->
  <rect x="200" y="70" width="130" height="70" rx="6" fill="#3d3d3d"/>
  <text x="265" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">NestJS API</text>
  <text x="265" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8e6e1">auth + jobs</text>

  <line x1="335" y1="105" x2="375" y2="105" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="375,105 365,99 365,111" fill="#1a1a1a"/>

  <!-- Agent -->
  <rect x="380" y="55" width="310" height="110" rx="8" fill="#1a1a1a"/>
  <text x="535" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">LLM Underwriting Agent (MCP tools)</text>
  <rect x="395" y="100" width="90" height="28" rx="4" fill="#3d3d3d"/>
  <text x="440" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e6e1">credit</text>
  <rect x="495" y="100" width="90" height="28" rx="4" fill="#3d3d3d"/>
  <text x="540" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e6e1">EMI/FOIR</text>
  <rect x="595" y="100" width="80" height="28" rx="4" fill="#3d3d3d"/>
  <text x="635" y="118" text-anchor="middle" font-family="monospace" font-size="10" fill="#e8e6e1">policy RAG</text>
  <text x="535" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cfccc4">cited decision memo · ~18s · ~$0.04</text>

  <!-- Down to rules -->
  <line x1="535" y1="170" x2="535" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="535,205 529,195 541,195" fill="#1a1a1a"/>

  <!-- Rules engine -->
  <rect x="380" y="210" width="310" height="70" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="535" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">12-rule business rules engine</text>
  <text x="535" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">block unsafe · escalate borderline · allow clean</text>

  <!-- Outcomes -->
  <line x1="380" y1="245" x2="340" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="340,245 350,239 350,251" fill="#1a1a1a"/>

  <rect x="170" y="210" width="160" height="70" rx="6" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="250" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">Human review</text>
  <text x="250" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">borderline cases</text>

  <line x1="250" y1="285" x2="250" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="250,315 244,305 256,305" fill="#1a1a1a"/>

  <rect x="170" y="320" width="160" height="50" rx="6" fill="#3d3d3d"/>
  <text x="250" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Decision + audit trail</text>

  <!-- Side notes -->
  <rect x="30" y="70" width="120" height="70" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <rect x="30" y="320" width="120" height="50" rx="6" fill="#ffffff" stroke="#cfccc4"/>
  <text x="90" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">Firecracker PDF</text>
  <text x="90" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">sandbox jobs</text>

  <line x1="90" y1="145" x2="90" y2="315" stroke="#cfccc4" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
