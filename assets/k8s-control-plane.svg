<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="Kubernetes control plane and worker nodes diagram">
  <rect width="720" height="405" fill="#f7f6f3"/>

  <text x="360" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6b6b6b">One brain (control plane), many muscles (nodes)</text>

  <!-- Control plane box -->
  <rect x="40" y="60" width="280" height="300" rx="8" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <rect x="40" y="60" width="280" height="40" rx="8" fill="#1a1a1a"/>
  <rect x="40" y="88" width="280" height="12" fill="#1a1a1a"/>
  <text x="180" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Control Plane</text>

  <rect x="60" y="118" width="240" height="52" rx="5" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="180" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">API Server</text>
  <text x="180" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">the front desk — everything talks to this</text>

  <rect x="60" y="180" width="240" height="52" rx="5" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="180" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">etcd</text>
  <text x="180" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">the notebook — stores desired state</text>

  <rect x="60" y="242" width="240" height="52" rx="5" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="180" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Scheduler</text>
  <text x="180" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">decides which node runs each pod</text>

  <rect x="60" y="304" width="240" height="40" rx="5" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="180" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Controller Manager</text>

  <!-- Arrow -->
  <line x1="325" y1="210" x2="375" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="375,210 365,204 365,216" fill="#1a1a1a"/>
  <text x="350" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">schedules</text>

  <!-- Worker nodes -->
  <rect x="380" y="60" width="300" height="300" rx="8" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <rect x="380" y="60" width="300" height="40" rx="8" fill="#3d3d3d"/>
  <rect x="380" y="88" width="300" height="12" fill="#3d3d3d"/>
  <text x="530" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Worker Nodes</text>

  <!-- Node 1 -->
  <rect x="400" y="118" width="260" height="100" rx="5" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="415" y="140" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Node A</text>
  <rect x="415" y="150" width="110" height="28" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="470" y="168" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">pod: web</text>
  <rect x="535" y="150" width="110" height="28" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="590" y="168" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">pod: api</text>
  <text x="415" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">kubelet + container runtime</text>

  <!-- Node 2 -->
  <rect x="400" y="232" width="260" height="100" rx="5" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="415" y="254" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Node B</text>
  <rect x="415" y="264" width="110" height="28" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="470" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">pod: db</text>
  <rect x="535" y="264" width="110" height="28" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="590" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">pod: cache</text>
  <text x="415" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#6b6b6b">kubelet + container runtime</text>
</svg>
