<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="Python tooling stack diagram">
  <rect width="720" height="405" fill="#f7f6f3"/>

  <text x="360" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6b6b6b">A small, explicit Python project layout</text>

  <rect x="180" y="80" width="360" height="55" rx="6" fill="#1a1a1a"/>
  <text x="360" y="114" text-anchor="middle" font-family="monospace" font-size="15" fill="#ffffff">scripts/</text>

  <rect x="120" y="155" width="220" height="55" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="230" y="189" text-anchor="middle" font-family="monospace" font-size="14" fill="#1a1a1a">stdlib only</text>

  <rect x="380" y="155" width="220" height="55" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="490" y="189" text-anchor="middle" font-family="monospace" font-size="14" fill="#1a1a1a">argparse CLI</text>

  <rect x="60" y="230" width="180" height="55" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="150" y="264" text-anchor="middle" font-family="monospace" font-size="14" fill="#1a1a1a">pathlib</text>

  <rect x="270" y="230" width="180" height="55" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="360" y="264" text-anchor="middle" font-family="monospace" font-size="14" fill="#1a1a1a">logging</text>

  <rect x="480" y="230" width="180" height="55" rx="6" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="570" y="264" text-anchor="middle" font-family="monospace" font-size="14" fill="#1a1a1a">typing</text>

  <line x1="360" y1="135" x2="230" y2="155" stroke="#cfccc4" stroke-width="2"/>
  <line x1="360" y1="135" x2="490" y2="155" stroke="#cfccc4" stroke-width="2"/>
  <line x1="230" y1="210" x2="150" y2="230" stroke="#cfccc4" stroke-width="2"/>
  <line x1="230" y1="210" x2="360" y2="230" stroke="#cfccc4" stroke-width="2"/>
  <line x1="490" y1="210" x2="360" y2="230" stroke="#cfccc4" stroke-width="2"/>
  <line x1="490" y1="210" x2="570" y2="230" stroke="#cfccc4" stroke-width="2"/>

  <text x="360" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a1a1a">Boring tools, readable code.</text>
</svg>
