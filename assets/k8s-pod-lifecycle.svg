<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="Kubernetes node anatomy with kubelet, runtime, and pods">
  <rect width="720" height="405" fill="#f7f6f3"/>

  <text x="360" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#6b6b6b">What actually lives on a worker node</text>

  <!-- Node outer box -->
  <rect x="50" y="60" width="620" height="310" rx="8" fill="#ffffff" stroke="#cfccc4" stroke-width="2"/>
  <text x="70" y="90" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Worker Node</text>

  <!-- Pods row -->
  <text x="70" y="124" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b6b6b">PODS (your containers, grouped)</text>

  <rect x="70" y="136" width="160" height="110" rx="6" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="150" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Pod</text>
  <rect x="85" y="172" width="130" height="26" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="150" y="189" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">container: app</text>
  <rect x="85" y="206" width="130" height="26" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="150" y="223" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">container: sidecar</text>

  <rect x="250" y="136" width="160" height="110" rx="6" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="330" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Pod</text>
  <rect x="265" y="172" width="130" height="52" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="330" y="202" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">container: worker</text>

  <rect x="430" y="136" width="160" height="110" rx="6" fill="#f0efeb" stroke="#cfccc4"/>
  <text x="510" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Pod</text>
  <rect x="445" y="172" width="130" height="52" rx="4" fill="#ffffff" stroke="#cfccc4"/>
  <text x="510" y="202" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a1a1a">container: cache</text>

  <!-- Agent row -->
  <text x="70" y="280" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b6b6b">NODE AGENTS (the plumbing)</text>

  <rect x="70" y="292" width="190" height="56" rx="5" fill="#1a1a1a"/>
  <text x="165" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">kubelet</text>
  <text x="165" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cfccc4">follows orders from control plane</text>

  <rect x="280" y="292" width="190" height="56" rx="5" fill="#3d3d3d"/>
  <text x="375" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Container runtime</text>
  <text x="375" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e8e6e1">Docker / containerd — runs containers</text>

  <rect x="490" y="292" width="160" height="56" rx="5" fill="#6b6b6b"/>
  <text x="570" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">kube-proxy</text>
  <text x="570" y="334" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f0efeb">routes traffic to pods</text>

  <!-- arrows from agents up to pods -->
  <line x1="165" y1="292" x2="150" y2="250" stroke="#cfccc4" stroke-width="1.5"/>
  <line x1="375" y1="292" x2="330" y2="250" stroke="#cfccc4" stroke-width="1.5"/>
  <line x1="570" y1="292" x2="510" y2="250" stroke="#cfccc4" stroke-width="1.5"/>
</svg>
