<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post — Tech Blog</title>
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html">Tech Blog</a>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch theme">
      <svg class="theme-toggle-icon theme-toggle-icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="theme-toggle-icon theme-toggle-icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <main class="post-page">
    <a class="back-link" href="index.html">&larr; All posts</a>

    <article class="a4-page" id="post-sheet">
      <div id="post-content" class="post-loading" role="status" aria-live="polite">
        <div class="page-spinner" aria-hidden="true"></div>
        <p class="loading-label">Loading post…</p>
      </div>
    </article>
  </main>

  <script type="module" src="js/post-page.js"></script>
</body>
</html>
